name: Daily Stock Analysis

on:
  schedule:
    # UTC时间，北京时间18:30 = UTC 10:30，周一至周五
    - cron: "30 10 * * 1-5"
  workflow_dispatch: # 支持手动点按钮测试

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run stock analysis
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          MARKET_REVIEW_ENABLE: "true"
          # SEARCH_BACKEND 控制搜索后端：tavily / searxng
          SEARCH_BACKEND: "tavily"
        run: python main.py

      # 上传报告为 Artifact，不会提交到仓库
      - name: Upload analysis report
        uses: actions/upload-artifact@v4
        with:
          name: stock‑daily‑report‑${{ github.run_id }}
          path: ./output/
          retention-days: 7  # 报告保留7天，可自行修改
